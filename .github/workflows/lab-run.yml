---
# Manual run against the LAB controller.
# GitHub-hosted runners cannot reach your controller, so this needs a self-hosted runner
# on a machine inside your network, registered with the label "lab-network".
# Credentials come from the secrets MC_USER, MC_PASSWORD and MC_ENABLE_PASSWORD of the "lab" environment.
name: Run playbook against lab (manual)

on:
  workflow_dispatch:
    inputs:
      playbook:
        description: Playbook to run
        type: choice
        required: true
        options:
          - client_status.yml
          - ap_uplink_health.yml
          - role_vlan_check.yml
      extra_vars:
        description: "Extra vars, e.g. client_mac=aa:bb:cc:dd:ee:ff expected_vlan=100"
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  run:
    runs-on: [self-hosted, lab-network]
    environment: lab
    steps:
      - uses: actions/checkout@v4

      - name: Run playbook
        env:
          MC_USER: ${{ secrets.MC_USER }}
          MC_PASSWORD: ${{ secrets.MC_PASSWORD }}
          MC_ENABLE_PASSWORD: ${{ secrets.MC_ENABLE_PASSWORD }}
          PLAYBOOK: ${{ inputs.playbook }}
          EXTRA_VARS: ${{ inputs.extra_vars }}
        run: |
          set -euo pipefail
          umask 077
          creds="inventory/group_vars/all/credentials.yml"
          trap 'rm -f "$creds"' EXIT
          # JSON is valid YAML, so quotes and special characters in passwords are safe.
          python3 -c 'import json, os; print(json.dumps({"mc_user": os.environ["MC_USER"], "mc_password": os.environ["MC_PASSWORD"], "mc_enable_password": os.environ["MC_ENABLE_PASSWORD"]}))' > "$creds"
          ansible-galaxy collection install -r requirements.yml
          ansible-playbook -i inventory/lab.yml "playbooks/$PLAYBOOK" \
            ${EXTRA_VARS:+-e "$EXTRA_VARS"}

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/
          if-no-files-found: ignore
